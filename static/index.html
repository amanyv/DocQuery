<!doctype html>
<html>
  <head>
    <title>DocQuery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <script>
      marked.use(
        markedKatex({
          throwOnError: false,
        }),
      );
    </script>
    
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <h3>📄 PDF Files</h3>

        <button id="upload-btn" onclick="document.getElementById('file-input').click()">
          + Upload PDF
        </button>
        <div style="font-size: 11px; color: #9ca3af; text-align: center">
          Max file size: 25MB
        </div>

        <input type="file" id="file-input" accept=".pdf" multiple onchange="uploadFiles(this)" />

        <div id="word-counter">
          0 / 100 characters
        </div>

        <div id="upload-status"></div>

        <div id="indexing-banner">
          <div class="spinner"></div>
          <span>Indexing documents…</span>
        </div>

        <div id="file-list"></div>

        <h3>⚙️ Quick Actions</h3>

        <div class="quick-actions-section">
          <button class="qa-btn blue" onclick="runSummarize()">
            🧠 Summarize All
          </button>
          <button class="qa-btn red" onclick="clearContext()">
            🗑️ Clear Chat
          </button>
        </div>
      </div>

      <div class="chat-area">
        <div class="chat-wrapper">
          <h2>DocQuery</h2>
          <div id="chat"></div>
          <div class="scroll-hint" id="scroll-hint" onclick="scrollToBottom()">
            ↓ New messages
          </div>
          <div class="input-box">
            <input
              type="text"
              id="q"
              placeholder="Ask something about your documents..."
              onkeydown="if (event.key === 'Enter') send();"
            />
            <button class="send-btn" id="send-btn" onclick="send()">Send</button>
          </div>
        </div>
        
        <div class="pdf-pane" id="pdf-pane">
          <div class="pdf-header">
            <span id="pdf-title">Document Viewer</span>
            <button class="close-pdf-btn" onclick="closePdf()">✕</button>
          </div>
          <iframe id="pdf-frame" src=""></iframe>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
